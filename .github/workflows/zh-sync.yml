name: Sync upstream and re-apply 汉化

# 拉取上游 can1357/oh-my-pi 的 main，在最新源码上重放汉化，校验后推送。
#
# 为什么重放而不是合并：上游每天都在改界面文案和代码结构。把汉化当成
# 一次性 diff，上游一动就冲突。这里把汉化拆成两部分——
#   1. i18n/dictionary.json —— 人工维护的英中词典
#   2. i18n/*.ts —— 确定性的 AST 重写器（作用于当前上游源码）
# 同步时重新跑一次重写器，冲突面因此收敛到词典条目本身。
#
# 本工作流只覆盖上游拥有的文件；本 fork 自有的文件（README、本工作流、
# i18n/、assets 等）在切换上游源码前先备份，切换后原样还原。
#
# 校验闸门：重写后源码必须仍能解析、CLI 必须能启动、类型检查必须通过。
# 任一步失败都不推送，避免把损坏的构建推到 main。

on:
   schedule:
      # 每天 UTC 03:17（避开整点，减少排队）
      - cron: "17 3 * * *"
   workflow_dispatch:
      inputs:
         upstream_ref:
            description: "上游分支或 tag（默认 main）"
            required: false
            default: "main"

permissions:
   contents: write

concurrency:
   group: zh-sync
   cancel-in-progress: false

env:
   UPSTREAM_REPO: can1357/oh-my-pi

jobs:
   sync:
      name: Re-apply 汉化 onto upstream
      runs-on: ubuntu-latest
      steps:
         - name: Checkout fork
           uses: actions/checkout@v4
           with:
              fetch-depth: 0
              token: ${{ secrets.GITHUB_TOKEN }}

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         - name: Configure git
           run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

         - name: Fetch upstream
           id: upstream
           run: |
              git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
              git fetch --no-tags --depth=1 upstream "${{ inputs.upstream_ref || 'main' }}"
              sha=$(git rev-parse FETCH_HEAD)
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "上游提交：$sha"

         - name: Skip when already up to date
           id: check
           run: |
              # 该提交已在 main 的历史里就不必重跑
              if git merge-base --is-ancestor "${{ steps.upstream.outputs.sha }}" HEAD; then
                 echo "need_sync=false" >> "$GITHUB_OUTPUT"
                 echo "已包含最新上游提交，跳过。"
              else
                 echo "need_sync=true" >> "$GITHUB_OUTPUT"
              fi

         # 本 fork 自有的文件：上游没有，或需要保持本仓库版本。
         # 切换上游源码前备份，切换后还原。
         - name: Back up fork-owned files
           if: steps.check.outputs.need_sync == 'true'
           run: |
              mkdir -p /tmp/fork-owned
              cp -R i18n /tmp/fork-owned/i18n
              cp README.md /tmp/fork-owned/README.md
              mkdir -p /tmp/fork-owned/workflows
              cp .github/workflows/zh-sync.yml /tmp/fork-owned/workflows/zh-sync.yml
              # 上游没有的 fork 资产（如 logo）一并保留
              if [ -d assets ]; then cp -R assets /tmp/fork-owned/assets; fi

         - name: Switch tree to upstream source
           if: steps.check.outputs.need_sync == 'true'
           run: |
              git checkout --force --detach "${{ steps.upstream.outputs.sha }}"
              # 清掉上游源码之外的一切（含旧翻译结果），但保留 .git
              git clean -fdx -e node_modules

         - name: Restore fork-owned files
           if: steps.check.outputs.need_sync == 'true'
           run: |
              rm -rf i18n
              cp -R /tmp/fork-owned/i18n i18n
              # report.json 是产物，不入库
              rm -f i18n/report.json
              cp /tmp/fork-owned/README.md README.md
              mkdir -p .github/workflows
              cp /tmp/fork-owned/workflows/zh-sync.yml .github/workflows/zh-sync.yml
              if [ -d /tmp/fork-owned/assets ]; then
                 rm -rf assets
                 cp -R /tmp/fork-owned/assets assets
              fi

         - name: Install dependencies
           if: steps.check.outputs.need_sync == 'true'
           run: bun install --frozen-lockfile

         - name: Apply 汉化
           if: steps.check.outputs.need_sync == 'true'
           run: bun i18n/translate.ts

         - name: Apply omp-zh command name
           if: steps.check.outputs.need_sync == 'true'
           run: bun i18n/apply-cli-name.ts

         - name: Gate — 汉化必须命中源码
           if: steps.check.outputs.need_sync == 'true'
           run: |
              # 若规则全部失效（上游重构了 UI 文案结构），提取器会命中 0 条。
              # 这种情况下重放等于什么都没做，必须停下来让人看，而不是静默推送。
              bun i18n/extract.ts --check | tee /tmp/extract.log
              count=$(grep -oE '[0-9]+ 条唯一界面文案' /tmp/extract.log | grep -oE '^[0-9]+' || echo 0)
              echo "提取命中：$count 条"
              if [ "$count" -lt 50 ]; then
                 echo "::error::提取器仅命中 $count 条文案，汉化规则可能已失效，停止同步。"
                 exit 1
              fi

         - name: Gate — 分组名必须与设置定义一致
           if: steps.check.outputs.need_sync == 'true'
           run: bun i18n/check-groups.ts

         - name: Gate — CLI 必须能启动
           if: steps.check.outputs.need_sync == 'true'
           run: |
              output=$(bun packages/coding-agent/src/cli.ts --version)
              echo "$output"
              case "$output" in
                 omp-zh/*) ;;
                 *) echo "::error::--version 未报告 omp-zh，停止同步。"; exit 1 ;;
              esac

         - name: Gate — 类型检查
           if: steps.check.outputs.need_sync == 'true'
           run: |
              (cd packages/utils && bun run check:types)
              (cd packages/tui && bun run check:types)
              (cd packages/coding-agent && bun run check:types)

         - name: Commit and push
           if: steps.check.outputs.need_sync == 'true'
           run: |
              git add -A
              if git diff --cached --quiet; then
                 echo "没有需要提交的改动。"
                 exit 0
              fi
              subject=$(git log -1 --format=%s "${{ steps.upstream.outputs.sha }}")
              git commit -m "chore(zh): 同步上游 ${{ steps.upstream.outputs.sha }} 并重放汉化" \
                 -m "上游提交：$subject"
              git push origin HEAD:main
